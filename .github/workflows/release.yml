name: release

on:
  push:
    tags: ["v*.*.*"]
  # A dry run (everything but publish) for changes to the release itself.
  pull_request:
    paths: [.github/workflows/release.yml, Makefile]

permissions:
  contents: read

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-dryrun' }}

# verify, reproducible and dist run on separate runners: cold Go builds are
# CPU-bound, so sharing one runner only made each slower. publish waits for
# all three. Nothing here uses a build cache.
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, not mutable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the collector version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^VERSION=//p' collector/collect.sh)
          [ "$got" = "$want" ] || { echo "collect.sh VERSION=$got but tag is $GITHUB_REF_NAME"; exit 1; }

      # The tagged commit already passed CI with identical code, so vet and
      # staticcheck would only repeat themselves. govulncheck runs again
      # (its database changes daily: a new advisory blocks the release), and
      # so do the tests, on exactly what's being published.
      - run: make -j2 --output-sync=target vuln test

  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: make reproducible VERSION="$VERSION"

  dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: make dist VERSION="$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, reproducible, dist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # keyless signing (Sigstore) and provenance
      attestations: write # build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # The files must be exactly what dist built.
      - name: Check the downloaded files against SHA256SUMS
        run: cd dist && sha256sum -c --strict SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # Sign the checksum list; every artifact is covered through it.
      - name: Sign SHA256SUMS (keyless, Sigstore)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file deploy/RELEASE_NOTES.md
