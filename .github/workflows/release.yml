name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # keyless signing (Sigstore) and provenance
      attestations: write # build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the collector version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^VERSION=//p' collector/collect.sh)
          [ "$got" = "$want" ] || { echo "collect.sh VERSION=$got but tag is $GITHUB_REF_NAME"; exit 1; }

      # The checks and the two reproducibility builds run side by side.
      - name: Check, and confirm the build is reproducible
        run: |
          make -j4 --output-sync=target check >check.log 2>&1 & c=$!
          make reproducible VERSION="$GITHUB_REF_NAME" >repro.log 2>&1 & r=$!
          s=0; wait $c || s=1; wait $r || s=1
          echo "::group::make check"; cat check.log; echo "::endgroup::"
          echo "::group::make reproducible"; cat repro.log; echo "::endgroup::"
          tail -n 1 repro.log
          exit $s
      - run: make dist VERSION="$GITHUB_REF_NAME"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # Sign the checksum list; every artifact is covered through it.
      - name: Sign SHA256SUMS (keyless, Sigstore)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file deploy/RELEASE_NOTES.md
