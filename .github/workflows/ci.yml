name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Static checks and tests run side by side; "check" (the required status)
  # passes only if both did.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, not mutable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Build and module cache, keyed on go.sum. CI only: releases build
          # without a cache.
          cache: true
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum

      - run: make -j4 --output-sync=target fmt vet lint vuln

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, not mutable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Build and module cache, keyed on go.sum. CI only: releases build
          # without a cache.
          cache: true
          cache-dependency-path: go.sum

      - name: Test (with race detector)
        run: CGO_ENABLED=1 go test -race -mod=vendor ./...

      - run: make build

  check:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A skipped or cancelled dependency must fail this, not pass it.
      - run: test "$LINT" = success && test "$TEST" = success
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}

  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Build and module cache, keyed on go.sum. CI only: releases build
          # without a cache.
          cache: true
          cache-dependency-path: go.sum

      - run: make test-collector
