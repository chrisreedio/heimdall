name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR cancels its older run. Pushes to main each run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A squash merge of a PR that was up to date with main puts on main exactly
  # the tree the PR's CI already passed, so the push run would only repeat it.
  # Skip the rest then; anything else (main moved on meanwhile, a direct push,
  # this lookup failing) runs everything. Releases test the tagged commit
  # again regardless (release.yml).
  fresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      skip: ${{ steps.same.outputs.skip }}
    steps:
      - id: same
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          skip=false
          tree() { gh api "repos/$REPO/git/commits/$1" -q .tree.sha; }
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" -q '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)
          # A change to a cache key's inputs runs everything, so main saves the
          # new caches PRs restore from (they can only read main's).
          keys=$(gh api "repos/$REPO/commits/$SHA" -q '[.files[].filename | select(. == "go.sum" or . == "Makefile" or . == ".github/workflows/ci.yml")] | length' || echo 1)
          if [ -n "$head" ] && [ "${keys:-1}" = 0 ] && [ "$(tree "$SHA")" = "$(tree "$head")" ]; then
            ok=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=check" -q '[.check_runs[] | select(.conclusion == "success")] | length' || echo 0)
            [ "${ok:-0}" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" | tee -a "$GITHUB_OUTPUT"

  # Static checks and tests run side by side; "check" (the required status)
  # passes only if both did.
  lint:
    needs: fresh
    if: ${{ !cancelled() && needs.fresh.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, not mutable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Build and module cache. Each job needs its own key: caches can't
          # be overwritten, and with a shared key the first job to finish
          # saves its (small) cache for everyone. CI only: releases build
          # without a cache.
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile

      - name: Verify dependencies
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum

      - run: make -j4 --output-sync=target fmt vet lint vuln build

  test:
    needs: fresh
    if: ${{ !cancelled() && needs.fresh.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, not mutable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The build cache is restored below instead: setup-go's keys on
          # go.sum, so once one was saved it was restored as an exact hit and
          # never saved again, and every run rebuilt everything since.
          cache: false

      # The build cache of the latest main run, keyed per commit so each
      # main run saves its own (here, or in warm when fresh skipped this
      # job). PRs can only read main's.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ github.sha }}
          restore-keys: go-test-

      # -count=1: the cache is for compiling only, and every test runs.
      - name: Test (with race detector)
        run: CGO_ENABLED=1 go test -race -mod=vendor -count=1 ./...

      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ github.sha }}

  # When fresh skips a main push, test doesn't run to save its cache; build
  # the same test binaries (running none) so the next PR starts warm.
  warm:
    needs: fresh
    if: ${{ !cancelled() && needs.fresh.outputs.skip == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ github.sha }}
          restore-keys: go-test-

      - run: CGO_ENABLED=1 go test -race -mod=vendor -count=1 -run '^$' ./...

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ github.sha }}

  check:
    needs: [fresh, lint, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A skipped or cancelled dependency must fail this, not pass it,
      # unless fresh skipped them all on purpose.
      - run: test "$SKIP" = true || { test "$LINT" = success && test "$TEST" = success; }
        env:
          SKIP: ${{ needs.fresh.outputs.skip }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}

  collector:
    needs: fresh
    if: ${{ !cancelled() && needs.fresh.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache: this job builds one small package, and it must not
          # claim a key the other jobs need.
          cache: false

      - run: make test-collector

  # The hub and a collector installed for real on the runner (a systemd VM
  # with passwordless sudo), driven the way an operator drives them. Catches
  # what unit tests stub away: sudo and privilege drops, systemd units, and
  # first runs on a quiet box. See deploy/test/installed-smoke.sh.
  installed:
    needs: fresh
    if: ${{ !cancelled() && needs.fresh.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache (see collector).
          cache: false

      - run: make dist VERSION=v0.0.0

      - run: sh deploy/test/installed-smoke.sh dist
