# Heimdall configuration. Unknown keys are rejected.
# Secrets (TLS keys aside, which are referenced by path) never go in this file.

# Relative paths are resolved against this file's directory.
database = "heimdall.db"

[ui]
# The UI always listens on loopback. Reach it with an SSH tunnel, or put
# HTTPS in front with `tailscale serve 8080` or Caddy and set base_url to
# that https:// address. Never expose it to the internet.
listen       = "127.0.0.1:8080"
base_url     = "http://127.0.0.1:8080"
session_idle = "30m"
session_max  = "12h"
# Behind `tailscale serve`, every sign-in comes from 127.0.0.1. true takes
# the client address (and tailnet user) from tailscale serve's headers, on
# requests from loopback only. Leave false behind anything else.
behind_tailscale_serve = false

[auth]
# Break-glass local accounts (password + TOTP). Set false once SSO works.
local_login = true

[auth.entra]
enabled          = false
tenant           = "organizations"   # or your tenant ID for single-tenant
client_id        = ""
allowed_tenants  = []
app_role_mapping = true
# The client secret/certificate is read from the systemd credential
# "heimdall-entra", never from this file.

[ingest]
# The only listener your servers should reach. Without tls_cert/tls_key it
# must bind to loopback behind a TLS-terminating proxy (e.g. Caddy).
listen        = "127.0.0.1:8443"
# tls_cert    = "/etc/heimdall/tls/cert.pem"
# tls_key     = "/etc/heimdall/tls/key.pem"
# What servers use to reach ingest; shown in the UI's "Add host" commands.
# public_url  = "https://ingest.example.com"
max_body      = "5MB"
rate_per_host = "30/h"
# allow_cidrs = ["203.0.113.0/24"]
# Set true when a local proxy (Caddy/nginx on this box) terminates TLS, so
# client IPs come from X-Forwarded-For. Only honored for loopback peers.
behind_proxy  = false

[feeds]
sync_interval = "6h"
osv           = true
kev           = true
epss          = true
endoflife     = true

[hosts]
stale_after        = "72h"
alert_after        = "3h"      # quiet this long: silence anomaly + immediate notice; "0" disables
keep_snapshots_for = "4320h"   # 180 days; "0" keeps everything
keep_snapshots_min = 30        # per host, whatever their age

[mcp]
# Read-only endpoint for AI assistants (Claude Code, Claude Desktop…).
# Expose over the tailnet with `tailscale serve --bg --https 8443 8090` (or
# similar) and set base_url to that https address. Users authenticate with
# their own tokens, from the UI's "AI assistants" page or with
# `heimdall user mcp-token create <email>`.
enabled  = false
listen   = "127.0.0.1:8090"
base_url = "http://127.0.0.1:8090"

[news]
# Threat news: curated "being exploited right now" incidents, matched on the
# hub against each host's open findings. Nothing about your servers leaves
# the hub. Items credit their source ("via pwn.watch"), and the hub fetches
# at most hourly, respecting caching headers. Any https feed in the same
# JSON shape can be added as a source.
enabled  = false
sources  = ["https://pwn.watch/incidents.json"]
interval = "1h"

[updates]
# Once a day, ask GitHub for the latest release's version number and show
# admins a banner when a newer one exists. Nothing is downloaded.
check = true

[notify]
# Counts-only digest (no hostnames, packages or CVEs), e.g. every = "24h".
# The same destinations get immediate alerts: hosts gone silent
# (hosts.alert_after) or back, and new high-signal anomalies (change or
# privilege watch disabled, privileged access outside a window, anything
# high severity). Alerts name org/host and a fixed label, nothing else.
every          = "0"
# Slack and Discord (and named JSON webhooks): each one's URL is a secret,
# stored with `sudo heimdall notify set-webhook <slack|discord|webhook> <name>`
# (never echoed, never in this file), which also adds it here. Several at once
# is fine. Check with `sudo heimdall notify test`.
# destinations = ["slack:ops", "discord:alerts"]
alert_anomalies = true               # false = only silence alerts and the digest
# email_to     = ["ops@example.com"]
# email_from   = "heimdall@example.com"
# smtp_host    = "smtp.example.com"
smtp_port      = 587                 # STARTTLS required; 465 = implicit TLS
# smtp_username = "heimdall"         # password: systemd credential "heimdall-smtp"
# The original generic webhook (still supported; prefer destinations above):
webhook        = false               # URL: systemd credential "heimdall-webhook"
webhook_format = "slack"             # "slack" = {"text": …}; "json" = the raw digest/alert

[ai]
# Optional server-side analysis with YOUR OWN Azure AI Foundry / Azure
# OpenAI model deployment: a daily fleet brief on the dashboard and
# "Explain this host" on host pages. Off by default. When on, compact,
# pre-aggregated facts (hostnames, OS, package names and versions, CVEs,
# counts) are sent to that endpoint; see docs/ai.md for exactly what.
# The API key is never in this file: run `sudo heimdall ai set-key`, then
# `heimdall ai test`.
enabled           = false
endpoint          = ""            # e.g. "https://myres.openai.azure.com"
deployment        = ""            # your deployment's name, sent as "model"
api               = "responses"   # or "chat" (Chat Completions)
# reasoning_effort = "low"        # sent only if set; depends on the model
brief_every       = "24h"         # "0" = on demand only
max_output_tokens = 8000          # includes reasoning tokens
max_input_tokens  = 24000         # per run (estimated); facts are trimmed to fit
timeout           = "2m"

# Coding agents for "Hand off to agent" (off unless listed). Each is a
# Discord bot that reads a channel and can open pull requests. Heimdall
# posts a fix request for one site's vulnerable Composer/npm packages to
# the channel's webhook and @mentions only that bot. The webhook URL is a
# secret: store it with `sudo heimdall notify set-webhook discord <name>`.
# This sends package and advisory details; see docs/deployment.md.
# [[agents]]
# name            = "pr-bot"                # shown in the confirm step
# discord_user_id = "123456789012345678"    # the bot's Discord user ID
# destination     = "discord:agents"        # a stored Discord webhook
